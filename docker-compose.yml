version: '3.8'

services:
  ifs-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MCP_TRANSPORT=sse
      - IFS_DOCS_VERSION=26R1
      - IFS_WORKSPACE_PATH=/app/workspace
    volumes:
      - d:/Project/clauger/clauger:/app/workspace
    restart: unless-stopped
